services:
  royal-gap-uat:
    build:
      context: ../
      dockerfile: ./deploy/Dockerfile
      args:
        - STAGE=uat
    restart: always
    networks:
      - royal-gap-network
      - royal-gap-network-uat
    volumes:
      - ../server:/app/server
      - ../app/src/assets:/app/app/src/assets
      - ../.env:/app/.env
      - ./builds/uat/:/app/build/
    environment:
      - PREFIX_PATH=/uat
      - HOST_DB_CONTAINER=royal-gap-uat-db
      - URL_SERVER_CONTAINER=https://gapv2.ngrok.app/uat
    command: ["${USER_DB_DEV}", "${PASS_DB_DEV}"]
    depends_on:
      - royal-gap-uat-db

  royal-gap-uat-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: gapv3
      MYSQL_USER: ${USER_DB_DEV}
      MYSQL_PASSWORD: ${PASS_DB_DEV}
      MYSQL_ROOT_PASSWORD: ${PASS_DB_DEV}
    networks:
      - royal-gap-network-uat
    volumes:
      - royal-gap-uat-volume-db:/var/lib/mysql

  royal-gap-uat-phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: royal-gap-uat-db
      PMA_USER: ${USER_DB_DEV}
      PMA_PASSWORD: ${PASS_DB_DEV}
    networks:
      - royal-gap-network-uat
    ports:
      - 8336:80
    depends_on:
      - royal-gap-uat-db

networks:
  royal-gap-network:
  royal-gap-network-uat:

volumes:
  royal-gap-uat-volume-db: